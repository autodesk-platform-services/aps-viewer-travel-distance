<script>

  let viewer = null;
  let _access_token = null;

  async function getToken() {
    await fetch('https://lowlblo75l.execute-api.us-east-1.amazonaws.com/default/GetTokenWithAHub').then(response => {
      return response.json();
    }).then(data => {
      _access_token = data.access_token;
    });
  }

  async function initAPSViewer(urn) {

    await getToken();

    const options = {
      env: 'AutodeskProduction',
      accessToken: _access_token,
      isAEC: true
    };

    Autodesk.Viewing.Initializer(options, () => {

      const div = document.getElementById('apsViewer');

      const config = { extensions: ['TravelDistanceExtension', 'MultipleSelectionExtension'] };

      viewer = new Autodesk.Viewing.Private.GuiViewer3D(div, config);
      viewer.start();
      viewer.setTheme('light-theme');
      Autodesk.Viewing.Document.load(`urn:${urn}`, async (doc) => {
        // AEC data: levels (3D Levels extension) and viewports (2D drawing scale).
        await doc.downloadAecModelData();
        const viewables = doc.getRoot().search({ type: 'geometry' });
        const select = document.getElementById('viewables');
        select.innerHTML = viewables.map((v, i) => `<option value="${i}">${v.is2D() ? '2D' : '3D'} - ${v.name()}</option>`).join('');
        select.onchange = () => loadViewable(doc, viewables[select.value]);
        const defaultIndex = Math.max(0, viewables.indexOf(doc.getRoot().getDefaultGeometry()));
        select.value = defaultIndex;
        loadViewable(doc, viewables[defaultIndex]);
      });
    });
  }

  async function loadViewable(doc, node) {
    await viewer.loadDocumentNode(doc, node);
    await viewer.waitForLoadDone();
    if (!node.is2D()) {
      // Isolate one level in 3D to select its floors/rooms/stairs as the walkable area.
      await viewer.loadExtension('Autodesk.AEC.LevelsExtension');
    }
    viewer.getExtension('TravelDistanceExtension').onModelChanged();
  }

</script>
